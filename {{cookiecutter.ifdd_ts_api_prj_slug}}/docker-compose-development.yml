# Development: the same image without token checks (every caller is the
# development user with both roles and the pattern {{ cookiecutter.ifdd_context_root }}),
# listening on 127.0.0.1 and not routed by the proxy. VictoriaMetrics of the
# ifdd-ts instance must be on the ingest network; the type service is
# reached through the proxy network.
services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env
    environment:
      IFDD_TS_API_AUTH_ENABLED: "false"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:{{ cookiecutter.ifdd_ts_api_port }}:{{ cookiecutter.ifdd_ts_api_port }}"
    networks:
      - ext-proxy-net
      - ingest
    labels:
      - "traefik.enable=false"

networks:
  ext-proxy-net:
    name: {{ cookiecutter.ifdd_proxy_network }}
    external: true
  ingest:
    name: {{ cookiecutter.ifdd_ts_ingest_network }}
    external: true
