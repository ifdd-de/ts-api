name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      # wheels/ may hold an unreleased build of ifdd-ts-core; pip prefers it.
      - name: Install
        run: pip install --find-links wheels -e ".[dev]"

      - name: Test
        run: |
          cp dotenv.dist .env
          pytest -q

      - name: Compose files
        run: |
          docker compose -f docker-compose-production.yml config --quiet
          docker compose -f docker-compose-development.yml config --quiet

  template:
    name: Template drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install cruft
        run: pip install cruft

      - name: Is this instance behind its template?
        # Informational: being behind is a decision, not a failure.
        continue-on-error: true
        run: cruft check

      - name: How far has this instance drifted from its template?
        continue-on-error: true
        run: cruft diff
